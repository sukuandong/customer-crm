<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理 · 云客 CRM</title>
<link rel="stylesheet" href="static/css/style.css">
</head>
<body class="admin-page">
  <div class="layout">
    <!-- 左侧菜单 -->
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <div class="brand-logo-mark">
          <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg>
        </div>
        <div class="side-brand-text"><strong>云客 CRM</strong><span>CUSTOMER SYSTEM</span></div>
      </div>

      <nav class="side-nav">
        <div class="nav-section-label">工作台</div>
        <a href="#" class="nav-item" data-nav="dashboard">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>概览看板</span>
        </a>
        <div class="nav-section-label">业务管理</div>
        <a href="#" class="nav-item active" data-nav="customers">
          <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>用户管理</span>
          <span class="nav-badge" id="navCount">0</span>
        </a>
        <a href="#" class="nav-item" data-nav="orders">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
          <span>订单管理</span>
        </a>
        <a href="#" class="nav-item" data-nav="reports">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          <span>数据报表</span>
        </a>
        <div class="nav-section-label">系统</div>
        <a href="#" class="nav-item" data-nav="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>系统设置</span>
        </a>
      </nav>

      <div class="side-bottom">
        <div class="side-user">
          <div class="avatar" id="sideAvatar">A</div>
          <div class="side-user-info"><strong id="sideUsername">admin</strong><span>系统管理员</span></div>
        </div>
        <button class="logout-btn" id="logoutBtn">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          退出登录
        </button>
      </div>
    </aside>

    <!-- 右侧主内容 -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menuToggle" title="展开/收起菜单">
            <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <div class="crumb"><span>业务管理</span><i>/</i><strong>用户管理</strong></div>
        </div>
        <div class="topbar-right">
          <span class="badge-api"><span class="dot"></span>REST API 已连接</span>
          <button class="icon-btn" title="通知">
            <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="notif-dot"></span>
          </button>
          <div class="avatar small" id="topAvatar">A</div>
        </div>
      </header>

      <div class="content">
        <div class="page-head">
          <div>
            <h1>用户管理</h1>
            <p>查看、搜索并维护系统中的客户信息</p>
          </div>
          <button class="btn btn-primary" id="addBtn">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> 新增用户
          </button>
        </div>

        <div class="stats" id="stats"></div>

        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">
              <h2>客户列表</h2>
              <span class="count-pill" id="countPill">0 位客户</span>
            </div>
            <div class="toolbar">
              <div class="search-box">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input id="searchInput" type="text" placeholder="搜索姓名 / 公司 / 电话">
              </div>
              <select id="statusFilter" class="select">
                <option value="">全部状态</option>
                <option value="潜在客户">潜在客户</option>
                <option value="跟进中">跟进中</option>
                <option value="已成交">已成交</option>
                <option value="已流失">已流失</option>
              </select>
              <button class="btn btn-ghost" id="resetBtn">
                <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg> 重置
              </button>
            </div>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>客户</th><th>公司</th><th>联系电话</th>
                  <th>行业</th><th>等级</th><th>状态</th><th>创建时间</th><th class="right">操作</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
            <div class="empty" id="empty" style="display:none">
              <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <p>没有找到匹配的客户</p>
            </div>
          </div>

          <div class="pagination">
            <span id="pageInfo">共 0 条</span>
            <div class="pager">
              <button class="page-btn" id="prevBtn" title="上一页"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
              <span id="pageNum">1 / 1</span>
              <button class="page-btn" id="nextBtn" title="下一页"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 新增/编辑弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">新增用户</h3>
        <button class="close" id="closeModal" title="关闭">&times;</button>
      </div>
      <form id="userForm" novalidate>
        <input type="hidden" id="uid">
        <div class="form-grid">
          <div class="form-item"><label>姓名 <i>*</i></label><input id="f_name" placeholder="请输入姓名"></div>
          <div class="form-item"><label>公司</label><input id="f_company" placeholder="请输入公司名称"></div>
          <div class="form-item"><label>电话</label><input id="f_phone" placeholder="请输入联系电话"></div>
          <div class="form-item"><label>邮箱</label><input id="f_email" type="email" placeholder="请输入邮箱"></div>
          <div class="form-item"><label>行业</label><input id="f_industry" placeholder="如：互联网、医疗"></div>
          <div class="form-item"><label>等级</label><select id="f_level"><option>普通</option><option>VIP</option></select></div>
          <div class="form-item"><label>状态</label><select id="f_status"><option>潜在客户</option><option>跟进中</option><option>已成交</option><option>已流失</option></select></div>
          <div class="form-item full"><label>备注</label><textarea id="f_remark" rows="3" placeholder="补充说明"></textarea></div>
        </div>
        <div class="error" id="formError"></div>
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" id="cancelBtn">取消</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="confirm-mask" id="confirmMask">
    <div class="confirm-box">
      <div class="confirm-icon">
        <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"/></svg>
      </div>
      <h3>确认删除</h3>
      <p id="confirmText">确定要删除该客户吗？此操作不可撤销。</p>
      <div class="confirm-foot">
        <button class="btn btn-ghost" id="confirmCancel">取消</button>
        <button class="btn btn-danger" id="confirmOk">确认删除</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast"></div>

  <script src="static/js/config.js"></script>
  <script src="static/js/app.js"></script>
</body>
</html>
