<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 客户管理系统</title>
<link rel="stylesheet" href="static/css/style.css">
</head>
<body class="login-page">
  <div class="login-shell">
    <!-- 左侧品牌展示区 -->
    <section class="login-brand">
      <div class="brand-decor d1"></div>
      <div class="brand-decor d2"></div>
      <div class="brand-decor d3"></div>
      <div class="brand-content">
        <div class="brand-logo">
          <div class="brand-logo-mark">
            <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg>
          </div>
          <span>云客 <b>CRM</b></span>
        </div>
        <div class="brand-copy">
          <h1>让客户关系<br>管理更简单</h1>
          <p>一个轻量、高效的客户管理平台，<br>助你轻松跟进每一位客户。</p>
        </div>
        <div class="brand-features">
          <div class="f-item"><span class="f-ic"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>集中管理客户资料</div>
          <div class="f-item"><span class="f-ic"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>实时掌握业务动态</div>
          <div class="f-item"><span class="f-ic"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>数据驱动增长决策</div>
        </div>
      </div>
      <div class="brand-footer">原生 HTML + CSS + JavaScript　·　FastAPI + SQLite</div>
    </section>

    <!-- 右侧登录表单区 -->
    <section class="login-panel">
      <div class="login-form-wrap">
        <div class="login-mobile-logo">
          <div class="brand-logo-mark">
            <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg>
          </div>
          <span>云客 <b>CRM</b></span>
        </div>
        <div class="login-heading">
          <h2>欢迎回来</h2>
          <p>登录您的账户，进入管理后台</p>
        </div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="username">账号</label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input id="username" name="username" type="text" placeholder="请输入账号" value="admin" autocomplete="username">
            </div>
          </div>
          <div class="field">
            <label for="password">密码</label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="password" name="password" type="password" placeholder="请输入密码" value="admin" autocomplete="current-password">
              <button type="button" class="pwd-toggle" id="pwdToggle" title="显示密码">
                <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="error" id="loginError"></div>
          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
            <span>登 录</span>
            <svg class="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>
        <div class="demo-hint">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          演示账号 <b>admin</b> / 密码 <b>admin</b>
        </div>
      </div>
      <div class="login-copyright">© 2026 云客 CRM · 演示项目</div>
    </section>
  </div>

  <script src="static/js/config.js"></script>
  <script src="static/js/login.js"></script>
</body>
</html>
